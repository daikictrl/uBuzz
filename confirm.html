<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>uBuzz - Email Verified</title>
    <!-- Outfit Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-glow: linear-gradient(135deg, #ff8c00, #e52d27);
            --text-color: #f1f2f6;
            --text-muted: #a4b0be;
            --success-color: #2ed573;
            --success-glow: rgba(46, 213, 115, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Abstract glowing blobs in background */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 1;
            opacity: 0.12;
            pointer-events: none;
        }

        body::before {
            background: #ff8c00;
            top: 15%;
            left: 15%;
            animation: float 14s infinite alternate;
        }

        body::after {
            background: #e52d27;
            bottom: 15%;
            right: 15%;
            animation: float 14s infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -40px) scale(1.15); }
        }

        .container {
            z-index: 2;
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 45px 35px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1px;
            background: var(--primary-glow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            display: inline-block;
        }

        .icon-circle {
            width: 84px;
            height: 84px;
            background: rgba(46, 213, 115, 0.08);
            border: 1px solid rgba(46, 213, 115, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            position: relative;
            box-shadow: 0 0 25px var(--success-glow);
            animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
            transform: scale(0);
        }

        @keyframes scaleIn {
            to { transform: scale(1); }
        }

        .checkmark {
            width: 32px;
            height: 32px;
            stroke: var(--success-color);
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            animation: drawCheckmark 0.7s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
        }

        @keyframes drawCheckmark {
            to { stroke-dashoffset: 0; }
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 14px;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        p {
            font-size: 15.5px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .subtext {
            font-size: 13px;
            color: #747d8c;
            line-height: 1.5;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">uBuzz</div>
        
        <div class="icon-circle">
            <svg class="checkmark" viewBox="0 0 24 24">
                <path d="M20 6L9 17L4 12" />
            </svg>
        </div>

        <h1>Email Confirmed!</h1>
        <p>Your email has been successfully verified by Elyse'😎. You can now return to the app and log in.</p>

        <div class="subtext">
            You can safely close this window and browser tab now.
        </div>
    </div>
</body>
</html>
